<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>数据回收｜Outfit 上新效果</title>
  <style>
    :root{--bg:#f5f7f9;--card:#fff;--ink:#18222d;--muted:#687581;--line:#e4e9ed;--accent:#146963;--accent-soft:#e5f2ef;--gold:#94520a;--gold-soft:#fff1d8;--red:#a53a32}

    .shell{max-width:1200px;margin:auto;padding:34px 28px 70px}.eyebrow{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.eyebrow:before{content:"";width:22px;height:2px;background:var(--accent)}
    .header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:28px}.header h1{font-size:clamp(28px,3vw,40px);line-height:1.14;margin:12px 0 8px;letter-spacing:-.035em}.sub{color:var(--muted);margin:0;max-width:760px}.back{white-space:nowrap;border:1px solid var(--line);background:#fff;text-decoration:none;padding:9px 13px;border-radius:9px;font-weight:700}.back:hover{border-color:var(--accent);color:var(--accent)}

    .panel{border-radius:13px;padding:20px 22px;margin-bottom:20px}.panel h2{font-size:16px;margin:0 0 12px}.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.insight{border-left:3px solid var(--accent);padding:1px 14px}.insight b{display:block;font-size:14px;margin-bottom:4px}.insight p{color:var(--muted);margin:0;font-size:12.5px;line-height:1.6}.caveat{font-size:12px;color:var(--muted);margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
    .toolbar{border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px;position:sticky;top:8px;z-index:3}.seg{display:flex;background:#eef2f3;padding:4px;border-radius:9px;gap:3px;max-width:100%;overflow-x:auto}.seg button{border:0;background:none;border-radius:7px;padding:9px 16px;color:var(--muted);font-weight:700;white-space:nowrap}.seg button.active{color:var(--accent);background:#fff;box-shadow:0 1px 4px #0001}.sort-wrap{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.sort-wrap select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;color:var(--ink)}.hint{font-size:12px;color:var(--muted);white-space:nowrap}
    .section{border-radius:12px;margin-bottom:14px;overflow:hidden}.section-header{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fbfcfc;padding:14px 18px;border-bottom:1px solid var(--line)}.section-header h2{font-size:17px;margin:0}.section-header small{font-size:12px;color:var(--muted);font-weight:500}.section-header .numbers{display:flex;gap:18px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.section-header .numbers b{color:var(--ink);font-size:14px}.table-head,.row{display:grid;grid-template-columns:minmax(170px,1.4fr) 56px repeat(3,minmax(105px,1fr)) 102px;align-items:center;gap:13px;padding:9px 18px}.table-head{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.03em}.table-head span:nth-child(n+3){text-align:right}.table-head .selected-metric{color:var(--accent)}.row{border:0;border-top:1px solid var(--line);box-shadow:none;min-height:76px}.row:hover{background:#fbfdfd}.name{min-width:0}.name b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thumb{width:48px;height:58px;object-fit:cover;border-radius:6px;border:1px solid #e7e9e9;background:#eee;display:block}.thumb-button{padding:0;background:none;border:0;width:48px;border-radius:6px}.thumb-button:focus-visible,.seg button:focus-visible,.back:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.num,.rate{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}.rate{color:var(--accent)}.metric{display:flex;justify-content:flex-end;align-items:center;min-height:32px;padding:0 8px;border-radius:6px}.metric.active{background:linear-gradient(90deg,rgba(20,105,99,.17) 0 var(--bar),transparent var(--bar) 100%)}.metric.active.rate{background:linear-gradient(90deg,rgba(20,105,99,.22) 0 var(--bar),transparent var(--bar) 100%)}.paid{font-size:11px;font-weight:800;padding:5px 7px;border-radius:6px;white-space:nowrap;text-align:center;display:inline-block}.paid.yes{color:var(--gold);background:var(--gold-soft)}.paid.no{color:#53636b;background:#edf1f2}.data-category{color:var(--muted);font-size:11px}.empty{padding:24px;color:var(--muted)}
    .method{color:var(--muted);font-size:12px;line-height:1.7;margin:22px 0 0}.method strong{color:var(--ink)}
    dialog{border:0;border-radius:13px;padding:0;max-width:min(90vw,800px);max-height:92vh;box-shadow:0 24px 80px #0005;background:#fff}dialog::backdrop{background:#101b27c9}.lightbox{padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center}.lightbox img{max-width:100%;max-height:75vh;object-fit:contain;border-radius:7px}.lightbox footer{display:flex;align-items:center;gap:16px;width:100%;justify-content:space-between}.lightbox p{margin:0;font-weight:700}.close{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px}
    @media(max-width:760px){.shell{padding:22px 13px 50px}.header{display:block}.back{display:inline-block;margin-top:14px}.stats{grid-template-columns:repeat(2,1fr)}.insights{grid-template-columns:1fr}.toolbar{position:static;flex-wrap:wrap}.hint{display:none}.section{overflow-x:auto}.table-head,.row{min-width:790px}.section-header{min-width:790px}}

    .toolbar{flex-wrap:wrap}.hint{white-space:normal}.report-panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px;margin-bottom:16px;box-shadow:0 3px 14px #18222d06}.report-panel h2{font-size:19px;margin:0 0 8px}.report-lead{color:var(--muted);font-size:13px;margin:0 0 16px}.report-callout{background:#e9f4f1;border-left:3px solid var(--accent);padding:14px 16px;line-height:1.75;border-radius:4px;color:#23524c;font-size:13px}.report-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.report-kpis>div{background:#f7f9fa;padding:15px;border-radius:9px}.report-kpis small{color:var(--muted);font-size:12px}.report-kpis strong{display:block;font-size:25px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:5px 0}.report-kpis p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}.report-table-wrap{overflow-x:auto}.report-table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}.report-table th{background:#f5f8f8;color:var(--muted);font-size:12px;text-align:right;white-space:nowrap;padding:12px;border-bottom:1px solid var(--line)}.report-table th:first-child,.report-table td:first-child{text-align:left}.report-table td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}.report-table td:last-child{min-width:110px}.report-table td:first-child{min-width:150px}.report-table tbody tr:hover{background:#fafcfc}.parameter{display:block;font-size:11px;color:var(--muted);margin-top:4px;word-break:break-word}.report-note{font-size:12px;color:var(--muted);line-height:1.75;margin:12px 0 0}.accent-text{color:var(--accent)}.comparison-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:20px 0}.comparison-bar-group h3{font-size:12px;color:var(--muted);margin:0 0 12px}.comparison-bar-row{display:grid;grid-template-columns:65px 1fr 70px;align-items:center;gap:8px;font-size:11px;margin:12px 0}.comparison-bar-row b{text-align:right;font-variant-numeric:tabular-nums}.comparison-bar-track{height:13px;background:#eff3f4;border-radius:4px;overflow:hidden}.comparison-bar-track i{display:block;height:100%;border-radius:4px}.comparison-bar-track .outfit{background:#2d8980}.comparison-bar-track .benchmark{background:#8e9eae}.report-panel summary{font-size:14px;font-weight:700;cursor:pointer}.report-panel[open] summary{margin-bottom:18px}.funnel-stages{display:flex;flex-direction:column;gap:4px;max-width:760px;margin:26px auto}.funnel-stage{padding:10px 0 14px;text-align:center}.funnel-stage:nth-child(1) .funnel-stage-track i{background:#61aaa1}.funnel-stage:nth-child(2) .funnel-stage-track i{background:#2d8980}.funnel-stage:nth-child(3) .funnel-stage-track i{background:#146963}.funnel-stage-top{display:flex;justify-content:center;gap:14px;align-items:center;margin-bottom:10px}.funnel-stage-top span{font-size:12px;color:var(--muted)}.funnel-stage-top strong{font-size:22px;font-variant-numeric:tabular-nums}.funnel-stage-track{display:flex;justify-content:center;height:44px;overflow:hidden}.funnel-stage-track i{display:block;height:100%;background:#2d8980;border-radius:5px}.funnel-stage small{display:block;color:var(--muted);font-size:12px;margin-top:10px}.event-reconcile{display:flex;height:28px;border-radius:6px;overflow:hidden;margin:20px 0 12px}.event-reconcile span{display:block}.event-reconcile .success{background:#2d8980}.event-reconcile .failure{background:#d69656}.event-reconcile .unknown{background:#a8b3bf}.event-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}.event-legend span:before{content:'●';margin-right:6px;color:#2d8980}.event-legend span:nth-child(2):before{color:#d69656}.event-legend span:nth-child(3):before{color:#a8b3bf}.report-findings p{font-size:13px;color:var(--muted);line-height:1.8}.report-findings b{color:var(--ink)}
    @media(max-width:900px){.comparison-bars{grid-template-columns:1fr}.comparison-bar-row{grid-template-columns:70px 1fr 90px}.funnel-stages{grid-template-columns:1fr}.report-kpis{grid-template-columns:1fr}.report-panel{padding:16px}.seg button{padding:9px 12px}.report-table{min-width:600px}}
    .insights{display:block}.overall-conclusion p{font-size:14px;line-height:1.85;margin:0 0 14px;color:var(--muted)}.overall-conclusion p:last-child{margin-bottom:0}.overall-conclusion b{color:var(--ink)}
    .funnel-tool-comparison table{min-width:940px}.funnel-tool-comparison .outfit-benchmark-row{background:#e5f2ef;font-weight:700}.funnel-tool-comparison td{white-space:nowrap}.funnel-tool-comparison td:last-child{min-width:100px}
    .funnel-sort-button{display:inline-flex;align-items:center;justify-content:flex-end;gap:7px;padding:0;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;white-space:nowrap;cursor:pointer}.funnel-sort-circle{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1.5px solid #a7b5bd;border-radius:50%;background:#fff;font-size:13px;line-height:1;flex-shrink:0}.funnel-sort-button.selected{color:var(--accent)}.funnel-sort-button.selected .funnel-sort-circle{border-color:var(--accent);background:var(--accent-soft)}.funnel-sort-button:hover .funnel-sort-circle{border-color:var(--accent)}.funnel-sort-button:focus-visible{outline:2px solid var(--accent);outline-offset:5px;border-radius:4px}.funnel-tool-comparison th{vertical-align:middle}
    .conclusion-points{list-style:none;padding:0;margin:0;color:#18222d;font-weight:400;font-size:14px;line-height:1.8}.conclusion-points li{position:relative;padding-left:15px;margin:0 0 10px}.conclusion-points li:last-child{margin-bottom:0}.conclusion-points li:before{content:'·';position:absolute;left:0;color:#18222d;font-weight:400}
    .conclusion-heading{font-size:14px;line-height:1.8;margin:0 0 8px;color:#18222d}.conclusion-heading strong{font-weight:700}.conclusion-group+.conclusion-group{margin-top:18px}
  </style>
</head>
<body>
  <main class="shell">
    <div class="header">
      <div><div class="eyebrow">UFace / Outfit / 2026.10.11—10.18</div><h1>数据回收</h1><p class="sub">点击保存对比采用实际 8 天数据；换装漏斗单独保留 10.11—10.22 的 12 天完整数据。</p></div>
      <a class="back" href="../index.html">← 返回品类参考</a>
    </div>
    <div class="stats" id="stats"></div>
    <section class="panel" aria-labelledby="analysis-title"><h2 id="analysis-title">综合结论</h2><div class="insights" id="insights"></div><p class="caveat">Outfit 与同期 Makeup：10.11—10.18；更新前 Makeover：10.03—10.10，均为实际 8 天。漏斗：10.11—10.22（12 天）。</p></section>
    <div class="toolbar"><div class="seg" aria-label="查看方式"><button type="button" id="by-category" aria-pressed="false">按照分类看</button><button type="button" id="by-reorder" aria-pressed="false">调整顺序结果</button><button type="button" id="by-makeover" class="active" aria-pressed="true">对比 Makeover</button><button type="button" id="by-makeup" aria-pressed="false">同期 Makeup</button><button type="button" id="by-funnel" aria-pressed="false">换装漏斗</button></div><div class="sort-wrap" id="sort-wrap" hidden><label for="sort">排序</label><select id="sort"><option value="clicks">点击数 ↓</option><option value="saves">保存数 ↓</option><option value="rate">保存率 ↓</option></select></div><span class="hint" id="view-hint">实际 8 天对比</span></div>
    <div id="results"></div>
  </main>
  <dialog id="image-dialog" aria-label="素材大图"><div class="lightbox"><img id="large-image" alt=""><footer><p id="large-name"></p><button class="close" id="close-dialog" type="button">关闭 ✕</button></footer></div></dialog>
  <script src="./data.js"></script>
  <script src="./comparison-data.js"></script>
  <script src="./comparison.js"></script>
  <script>
    (() => {
      const rows = OUTFIT_DATA.rows;
      const categories = ['Casual','Party','Traditional','Wedding'];
      const categoryNames = {Casual:'日常 Casual',Party:'派对 Party',Traditional:'传统 Traditional',Wedding:'婚礼 Wedding'};
      const number = n => n.toLocaleString('zh-CN');
      const percent = n => (n*100).toFixed(1)+'%';
      const sum = (list, key) => list.reduce((total, row) => total + row[key], 0);
      const totalClicks = sum(rows,'clicks'), totalSaves = sum(rows,'saves');
      const paidRows = rows.filter(row => row.paid), freeRows = rows.filter(row => !row.paid);
      const top = [...rows].sort((a,b) => b.clicks-a.clicks)[0];
      const topRate = [...rows].filter(row => row.clicks >= 500).sort((a,b) => b.rate-a.rate)[0];
      document.querySelector('#stats').innerHTML = [
        ['Outfit 有效效果', number(rows.length), '四个正式分类'],
        ['Outfit 点击数', number(totalClicks), 'Outfit 点击事件'],
        ['Outfit 保存数', number(totalSaves), 'Outfit 保存事件'],
        ['Outfit 保存率', percent(totalSaves/totalClicks), '保存事件数 ÷ 点击事件数'],
      ].map(([label,value,note]) => `<div class="stat"><small>${label}</small><strong>${value}</strong><em>${note}</em></div>`).join('');
      const comparison = REPORT_COMPARISON;
      document.querySelector('#insights').innerHTML = `<div class="conclusion-group"><p class="conclusion-heading"><strong>Outfit替换 Makeover 后表现提升，同样 8 天</strong></p><ul class="conclusion-points"><li>Outfit 点击量为Makeover的 6.27 倍，保存量为 11.03 倍。</li><li>Makeover保存率 12.9% ，替换后Outfit保存率为 22.6%，提升 9.7 个百分点。</li></ul></div><div class="conclusion-group"><p class="conclusion-heading"><strong>Outfit 对比同期 Makeup保存率更高</strong></p><ul class="conclusion-points"><li>Outfit 的保存率为 22.6%，高于 Makeup 的 13.7%，领先 8.9 个百分点。</li></ul></div>`;
      let mode = 'makeover';
      let funnelSortKey = 'saveRate';
      const results = document.querySelector('#results');
      const sort = document.querySelector('#sort');
      function metricHTML(row, key, activeMetric, maxValue) {
        const active = key === activeMetric;
        const bar = active ? ` style="--bar:${(row[key] / maxValue * 100).toFixed(1)}%"` : '';
        const value = key === 'rate' ? percent(row[key]) : number(row[key]);
        return `<div class="metric ${key === 'rate' ? 'rate' : 'num'}${active ? ' active' : ''}"${bar}>${value}</div>`;
      }
      function rowHTML(row, showCategory, activeMetric, maxValue) {
        return `<div class="row"><div class="name"><b title="${row.name}">${row.name}</b><small>${row.english}${showCategory ? ' · '+categoryNames[row.category] : ''}</small></div><button class="thumb-button" type="button" data-image="${row.id}" aria-label="放大${row.name}图片"><img class="thumb" src="${row.thumb}" alt="${row.name}" loading="lazy"></button>${metricHTML(row,'clicks',activeMetric,maxValue)}${metricHTML(row,'saves',activeMetric,maxValue)}${metricHTML(row,'rate',activeMetric,maxValue)}<div><span class="paid ${row.paid?'yes':'no'}">${row.paid?'付费效果':'免费效果'}</span></div></div>`;
      }
      function tableHeader(activeMetric) { return `<div class="table-head"><span>名字</span><span>图片</span><span class="${activeMetric==='clicks'?'selected-metric':''}">点击数</span><span class="${activeMetric==='saves'?'selected-metric':''}">保存数</span><span class="${activeMetric==='rate'?'selected-metric':''}">保存率</span><span>是否付费效果</span></div>`; }
      function alternateByPaid(items) {
        const paid = items.filter(row => row.paid).sort((a,b) => b.rate-a.rate || b.clicks-a.clicks);
        const free = items.filter(row => !row.paid).sort((a,b) => b.rate-a.rate || b.clicks-a.clicks);
        const ordered = [];
        let nextPaid = (paid[0]?.rate ?? -1) >= (free[0]?.rate ?? -1);
        while (paid.length || free.length) {
          const queue = nextPaid ? paid : free;
          if (queue.length) ordered.push(queue.shift());
          nextPaid = !nextPaid;
        }
        return ordered;
      }
      function render() {
        const isReorder = mode === 'reorder';
        const isComparison = ['makeover','makeup','funnel'].includes(mode);
        const key = isReorder ? 'rate' : sort.value;
        const sortName = {clicks:'点击数',saves:'保存数',rate:'保存率'}[key];
        ['category','reorder','makeover','makeup','funnel'].forEach(view => {
          const button = document.querySelector('#by-'+view);
          button.classList.toggle('active',mode===view);
          button.setAttribute('aria-pressed',String(mode===view));
        });
        document.querySelector('#sort-wrap').hidden = isReorder || isComparison;
        if (isComparison) {
          document.querySelector('#view-hint').textContent = mode === 'funnel' ? '10.11—10.22 · 12 天事件漏斗' : '实际 8 天对比 · 点击—保存率';
          results.innerHTML = renderComparison(mode,funnelSortKey);
          return;
        }
        document.querySelector('#view-hint').textContent = isReorder ? '分类按整体保存率降序 · 付费/免费交替，各自按保存率降序' : `分类内按${sortName}降序 · 比例条以分类内最大值为 100%`;
        const groups = categories.map(category => ({category, rows:rows.filter(row => row.category === category)}));
        if (isReorder) groups.sort((a,b) => sum(b.rows,'saves')/sum(b.rows,'clicks') - sum(a.rows,'saves')/sum(a.rows,'clicks'));
        results.innerHTML = groups.map(({category, rows:groupRows}) => {
          const items = isReorder ? alternateByPaid(groupRows) : [...groupRows].sort((a,b) => b[key]-a[key] || b.clicks-a.clicks || a.name.localeCompare(b.name));
          const clicks = sum(items,'clicks'), saves = sum(items,'saves');
          const label = isReorder ? '付费/免费交替 · 组内保存率↓' : `按${sortName}↓`;
          const maxValue = Math.max(...items.map(row => row[key]));
          return `<section class="section"><div class="section-header"><h2>${categoryNames[category]} <small>${items.length} 个效果 · ${label}</small></h2><div class="numbers"><span>点击 <b>${number(clicks)}</b></span><span>保存 <b>${number(saves)}</b></span><span>保存率 <b>${percent(saves/clicks)}</b></span></div></div>${tableHeader(key)}${items.map(row => rowHTML(row,false,key,maxValue)).join('')}</section>`;
        }).join('');
      }
      ['category','reorder','makeover','makeup','funnel'].forEach(view => document.querySelector('#by-'+view).addEventListener('click',()=>{mode=view;render();}));
      sort.addEventListener('change',render);
      const dialog = document.querySelector('#image-dialog');
      results.addEventListener('click', event => {
        const sortButton = event.target.closest('[data-funnel-sort]');
        if (sortButton) {
          funnelSortKey = sortButton.dataset.funnelSort;
          render();
          return;
        }
        const button = event.target.closest('[data-image]');
        if (!button) return;
        const row = rows.find(item => item.id === button.dataset.image);
        document.querySelector('#large-image').src = row.image;
        document.querySelector('#large-image').alt = row.name;
        document.querySelector('#large-name').textContent = row.name + ' · ' + row.english;
        dialog.showModal();
      });
      document.querySelector('#close-dialog').addEventListener('click', () => dialog.close());
      dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
      render();
    })();
  </script>
</body>
</html>
