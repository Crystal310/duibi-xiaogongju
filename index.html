<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量图片对比评测台</title>
<style>
:root{
  --bg:#f2f1ed; --surface:#ffffff; --surface-2:#fafaf7; --ink:#1c1b19; --ink-dim:#6b6863;
  --line:#e2e0d9; --accent:#2f5fd6; --accent-ink:#ffffff;
  --good:#2f8a5b; --good-bg:#e5f3ea; --bad:#c4402f; --bad-bg:#fbe8e5; --pending:#b9862a; --pending-bg:#faf0dd;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17181a; --surface:#212226; --surface-2:#1b1c1f; --ink:#eeece6; --ink-dim:#9b988f; --line:#34353a;
    --accent:#7d9dff; --accent-ink:#101223; --good:#5fc98b; --good-bg:#173225; --bad:#ef7e6d; --bad-bg:#331c19;
    --pending:#e3b45c; --pending-bg:#332811; }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'PingFang SC','Hiragino Sans GB',system-ui,sans-serif;padding:20px 16px;}
.wrap{max-width:none;margin:0;}
.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;}
.masthead .kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);font-weight:700;margin-bottom:6px;}
.masthead h1{font-size:24px;font-weight:800;margin:0;}
.masthead p{color:var(--ink-dim);font-size:13px;margin:4px 0 0;max-width:60ch;}
.tabs{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:10px;}
.tab{border:none;background:transparent;color:var(--ink-dim);font:inherit;font-weight:700;font-size:13px;padding:9px 14px;border-radius:7px;cursor:pointer;white-space:nowrap;}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.tab:disabled{opacity:.4;cursor:not-allowed;}
.screen{display:none;border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden;}
.screen.active{display:block;}
.screen-hd{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.screen-hd .title{font-size:15px;font-weight:800;}
.screen-hd .sub{font-size:12.5px;color:var(--ink-dim);}
.screen-body{padding:22px;}
.btn{border:none;border-radius:9px;font:inherit;font-weight:800;font-size:13px;padding:10px 18px;cursor:pointer;}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px;}

/* page1 */
.upload-grid{display:flex;flex-wrap:wrap;gap:16px;}
.dropzone{flex:1 1 260px;border:2px dashed var(--line);border-radius:14px;background:var(--surface-2);padding:18px;display:flex;flex-direction:column;gap:10px;min-height:230px;transition:border-color .15s,background .15s;position:relative;}
.dropzone.dragover{border-color:var(--accent);background:var(--good-bg);}
.dz-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.dz-label-input{font-size:14.5px;font-weight:800;border:none;background:transparent;color:var(--ink);font-family:inherit;padding:2px 4px;border-radius:5px;flex:1;min-width:0;}
.dz-label-input:hover,.dz-label-input:focus{background:var(--surface);outline:1px solid var(--line);}
.dz-remove{border:none;background:transparent;color:var(--ink-dim);cursor:pointer;font-size:15px;width:24px;height:24px;border-radius:50%;flex-shrink:0;line-height:1;}
.dz-remove:hover{background:var(--bad-bg);color:var(--bad);}
.dz-remove:disabled{opacity:.25;cursor:not-allowed;}
.dropzone .dz-hint{font-size:12px;color:var(--ink-dim);}
.dz-drop{flex:1;border-radius:10px;border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-dim);font-size:12.5px;text-align:center;padding:12px;cursor:pointer;min-height:90px;}
.dz-thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-height:120px;overflow:auto;}
.dz-thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;background:var(--line);}
.dz-progress-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
.dz-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;}
.dz-bar>span{display:block;height:100%;background:var(--accent);border-radius:99px;width:0%;}
.dz-add{flex:1 1 260px;min-height:230px;border:2px dashed var(--line);border-radius:14px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-dim);cursor:pointer;font-size:13px;font-weight:700;}
.dz-add:hover{border-color:var(--accent);color:var(--accent);}
.dz-add .plus{font-size:26px;line-height:1;}
.match-note{margin-top:18px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:12.5px;color:var(--ink-dim);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.match-note b{color:var(--ink);}

/* page2 */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--surface-2);}
@media (max-width:760px){.stat-row{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;}
.stat .n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
.stat .l{font-size:11px;color:var(--ink-dim);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.stat.good .n{color:var(--good);} .stat.bad .n{color:var(--bad);} .stat.pending .n{color:var(--pending);}
.review-layout{display:grid;grid-template-columns:1fr 280px;}
@media (max-width:900px){.review-layout{grid-template-columns:1fr;}}
.review-main{padding:22px;border-right:1px solid var(--line);}
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.nav-row .fname{font-size:12.5px;color:var(--ink-dim);font-family:ui-monospace,monospace;}
.navbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;color:var(--ink);}
.navbtn:disabled{opacity:.35;cursor:not-allowed;}
.triple{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:16px;}
.triple .cell{height:min(38vh,360px);flex:0 0 auto;border-radius:10px;background:var(--surface-2);position:relative;overflow:hidden;border:1px solid var(--line);}
.triple .cell img{height:100%;width:auto;max-width:100%;display:block;object-fit:contain;}
.triple .cell .cap{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:800;background:rgba(0,0,0,.55);color:#fff;padding:2px 7px;border-radius:99px;}
.triple .cell.missing{display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:12px;text-align:center;padding:8px;width:calc(min(38vh,360px) * 0.75);min-width:140px;}
.tagbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.tagbtn{flex:1;min-width:100px;padding:11px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font:inherit;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink-dim);}
.tagbtn[data-tag="good"].picked{border-color:var(--good);color:var(--good);background:var(--good-bg);}
.tagbtn[data-tag="bad"].picked{border-color:var(--bad);color:var(--bad);background:var(--bad-bg);}
.tagbtn[data-tag="pending"].picked{border-color:var(--pending);color:var(--pending);background:var(--pending-bg);}
.note-label{font-size:11px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
textarea.note{width:100%;min-height:54px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:13px;padding:10px;resize:vertical;}
.review-side{background:var(--surface-2);display:flex;flex-direction:column;max-height:min(65vh,600px);}
.side-hd{padding:14px 16px;border-bottom:1px solid var(--line);font-size:11px;font-weight:800;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;}
.side-list{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:3px;}
.side-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px;border:1px solid transparent;}
.side-item.current{background:var(--surface);border-color:var(--line);}
.side-item .sw{width:26px;height:26px;border-radius:5px;object-fit:cover;background:var(--line);flex-shrink:0;}
.side-item .nm{flex:1;font-family:ui-monospace,monospace;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot.good{background:var(--good);} .dot.bad{background:var(--bad);} .dot.pending{background:var(--pending);} .dot.none{background:var(--line);}
.finish-row{padding:14px 16px;border-top:1px solid var(--line);}

/* page3 */
.filter-row{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink-dim);font:inherit;font-weight:700;font-size:12px;padding:7px 13px;border-radius:99px;cursor:pointer;}
.pill.active{background:var(--ink);color:var(--surface);border-color:var(--ink);}
.result-grid{padding:20px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
@media (max-width:600px){.result-grid{grid-template-columns:1fr;}}
.rcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2);}
.rcard .triplerow{display:grid;gap:2px;background:var(--line);cursor:zoom-in;}
.rcard .triplerow .cell{aspect-ratio:3/4;background:var(--surface);overflow:hidden;}
.rcard .triplerow .cell img{width:100%;height:100%;object-fit:contain;}
.rcard .meta{padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.rcard .fname{font-size:11px;font-family:ui-monospace,monospace;color:var(--ink-dim);}
.rcard .note{padding:0 12px 12px;font-size:12px;color:var(--ink-dim);line-height:1.5;}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;border:none;cursor:pointer;font-family:inherit;}
.badge.good{background:var(--good-bg);color:var(--good);} .badge.bad{background:var(--bad-bg);color:var(--bad);} .badge.pending{background:var(--pending-bg);color:var(--pending);} .badge.none{background:var(--line);color:var(--ink-dim);}
.export-row{padding:14px 22px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--ink-dim);font-size:12px;}

/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(10,10,10,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:24px;}
.lightbox.open{display:flex;}
.lightbox-inner{background:var(--surface);border-radius:14px;max-width:min(1100px,96vw);max-height:92vh;overflow:auto;padding:20px;}
.lightbox-imgs{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.lightbox-imgs .cell{flex:1;min-width:120px;background:var(--surface-2);border-radius:8px;overflow:hidden;border:1px solid var(--line);}
.lightbox-imgs img{width:100%;display:block;object-fit:contain;max-height:60vh;margin:0 auto;}
.lightbox-tools{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.hint{font-size:11.5px;color:var(--ink-dim);}
.empty-hint{color:var(--ink-dim);font-size:13px;padding:40px;text-align:center;}
.overlay-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:60;font-size:14px;}
.overlay-mask.show{display:flex;}
input[type=file]{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <div class="kicker">批量图片对比评测工具</div>
      <h1>批量图片对比评测台</h1>
    </div>
    <div class="tabs">
      <button class="tab active" data-target="p1">① 上传</button>
      <button class="tab" data-target="p2" id="tabP2" disabled>② 逐条评测</button>
      <button class="tab" data-target="p3" id="tabP3" disabled>③ 结果汇总</button>
    </div>
  </div>

  <!-- PAGE 1 -->
  <div class="screen active" id="p1">
    <div class="screen-hd">
      <div>
        <div class="title">上传素材</div>
        <div class="sub">各卡片按文件名前缀一一对应（如 0001_src.jpg / 0001_cloth.jpg，或完全同名也可），卡片名字可点击直接改</div>
      </div>
      <button class="btn btn-primary" id="btnPair">开始配对 →</button>
    </div>
    <div class="screen-body">
      <div class="upload-grid" id="uploadGrid"></div>
      <div class="match-note" id="matchNote"></div>
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="screen" id="p2">
    <div class="screen-hd">
      <div>
        <div class="title">逐条评测</div>
        <div class="sub">← → 键或点击侧栏切换，标记会自动保存</div>
      </div>
      <button class="btn btn-primary" id="btnFinish">整理结果 →</button>
    </div>
    <div class="stat-row">
      <div class="stat good"><div class="n" id="statGoodPct">0%</div><div class="l">Good case 率</div></div>
      <div class="stat bad"><div class="n" id="statBadPct">0%</div><div class="l">Bad case 率</div></div>
      <div class="stat pending"><div class="n" id="statPendingPct">0%</div><div class="l">Medium 中等可通过率</div></div>
      <div class="stat"><div class="n" id="statMarked">0 / 0</div><div class="l">已标记 / 总数</div></div>
    </div>
    <div class="review-layout">
      <div class="review-main">
        <div class="nav-row">
          <button class="navbtn" id="navPrev">‹</button>
          <span class="fname" id="curFname">-</span>
          <button class="navbtn" id="navNext">›</button>
        </div>
        <div class="triple" id="curTriple"></div>
        <div class="tagbar">
          <button class="tagbtn" data-tag="good">✓ 通过</button>
          <button class="tagbtn" data-tag="bad">✕ 不通过</button>
          <button class="tagbtn" data-tag="pending">? Medium 中等可通过</button>
        </div>
        <div class="note-label">评语</div>
        <textarea class="note" id="curNote" placeholder="记录具体问题，例如：领口褶皱穿模、袖长比例失真…"></textarea>
      </div>
      <div class="review-side">
        <div class="side-hd" id="sideCount">全部 0 组</div>
        <div class="side-list" id="sideList"></div>
        <div class="finish-row"><button class="btn btn-ghost" style="width:100%;" id="btnFinish2">整理结果 →</button></div>
      </div>
    </div>
  </div>

  <!-- PAGE 3 -->
  <div class="screen" id="p3">
    <div class="screen-hd">
      <div>
        <div class="title">结果汇总</div>
        <div class="sub">点击任意卡片放大 / 下载，标签可直接改</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" id="reportTitleInput" placeholder="报告标题（导出时显示在页面顶部，默认「图片对比评测报告」）" style="width:280px;max-width:40vw;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:12.5px;">
        <button class="btn btn-primary" id="btnExportLocal">导出当前筛选为 HTML</button>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-pills" id="filterPills">
        <button class="pill active" data-f="all">全部</button>
        <button class="pill" data-f="bad">仅 Bad case</button>
        <button class="pill" data-f="good">仅 Good case</button>
        <button class="pill" data-f="pending">仅 Medium</button>
        <button class="pill" data-f="marked">只看已标记</button>
      </div>
      <span class="hint" id="filterCount"></span>
    </div>
    <div class="result-grid" id="resultGrid"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <div class="lightbox-imgs" id="lightboxImgs"></div>
    <div class="lightbox-tools">
      <span class="fname" id="lightboxName"></span>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="badge good" data-tag="good">✓ 通过</button>
        <button class="badge bad" data-tag="bad">✕ 不通过</button>
        <button class="badge pending" data-tag="pending">? Medium</button>
        <button class="btn btn-ghost btn-sm" id="btnDownload">下载合成图</button>
        <button class="btn btn-ghost btn-sm" id="btnCloseLb">关闭</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay-mask" id="overlay"><div id="overlayText">处理中…</div></div>

<script>
/* ================== 常量 ================== */
const MAX_ZONES = 5;
const MAX_FILES = 400;
const ZONES_KEY = 'wearCheckZones';
const DEFAULT_ZONES = [
  { id: 'z1', name: '原图' },
  { id: 'z2', name: '服装图' },
  { id: 'z3', name: '结果图' },
];

/* ================== 数据层：IndexedDB ================== */
const DB_NAME = 'wear-check-db';
const DB_VERSION = 2; // v2: 数据结构改为多卡片 values{} 结构，与 v1（固定 src/cloth/out）不兼容
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(db.objectStoreNames.contains('items')) db.deleteObjectStore('items');
      db.createObjectStore('items', { keyPath: 'key' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function dbPutAll(items){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('items', 'readwrite');
    items.forEach(it => tx.objectStore('items').put(it));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbPut(item){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('items', 'readwrite');
    tx.objectStore('items').put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGetAll(){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('items', 'readonly');
    const req = tx.objectStore('items').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/* ================== 全局状态 ================== */
function loadZones(){
  try{
    const saved = JSON.parse(localStorage.getItem(ZONES_KEY) || 'null');
    if(Array.isArray(saved) && saved.length) return saved;
  }catch(e){}
  return DEFAULT_ZONES.map(z => ({ ...z }));
}
function saveZones(){ localStorage.setItem(ZONES_KEY, JSON.stringify(state.zones)); }

const state = {
  zones: loadZones(),   // [{id, name}]
  pending: {},           // zoneId -> File[]
  items: [],             // {key, values:{zoneId:{name,blob,url,w,h}}, tag, note}
  curIndex: 0,
  filter: 'all',
};
state.zones.forEach(z => { state.pending[z.id] = []; });

/* ================== 工具函数 ================== */
function basename(name){ return name.replace(/\.[^.]+$/, ''); }
function stripLastSegment(base){
  const iu = base.lastIndexOf('_');
  const id = base.lastIndexOf('-');
  const cut = Math.max(iu, id);
  return cut > 0 ? base.slice(0, cut) : base;
}
const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });

// 自动判断配对模式：完全同名优先，若重名冲突严重则改用"去掉最后一段"的方式
function computeKeys(files){
  const noStrip = files.map(f => basename(f.name));
  const stripped = files.map(f => stripLastSegment(basename(f.name)));
  const uniqNo = new Set(noStrip).size / files.length;
  const uniqStripped = new Set(stripped).size / files.length;
  return (uniqStripped >= uniqNo * 0.9) ? stripped : noStrip;
}

async function compressImage(file, maxDim=1400, quality=0.85){
  const bitmap = await createImageBitmap(file);
  let { width, height } = bitmap;
  if(Math.max(width, height) > maxDim){
    const scale = maxDim / Math.max(width, height);
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, width, height);
  bitmap.close && bitmap.close();
  const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
  return { blob, width, height };
}

function blobToDataURL(blob){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

function zoneName(id){
  const z = state.zones.find(z => z.id === id);
  return z ? z.name : id;
}

/* ================== 页面 1：上传（动态卡片） ================== */
function renderUploadZones(){
  const grid = document.getElementById('uploadGrid');
  grid.innerHTML = '';

  state.zones.forEach(zone => {
    if(!state.pending[zone.id]) state.pending[zone.id] = [];
    const arr = state.pending[zone.id];

    const box = document.createElement('div');
    box.className = 'dropzone';
    box.dataset.zone = zone.id;

    const head = document.createElement('div');
    head.className = 'dz-head';
    const nameInput = document.createElement('input');
    nameInput.className = 'dz-label-input';
    nameInput.value = zone.name;
    nameInput.maxLength = 20;
    nameInput.addEventListener('input', () => {
      zone.name = nameInput.value || zone.name;
      saveZones();
    });
    const removeBtn = document.createElement('button');
    removeBtn.className = 'dz-remove';
    removeBtn.innerHTML = '&times;';
    removeBtn.title = '删除这张卡片';
    removeBtn.disabled = state.zones.length <= 1;
    removeBtn.addEventListener('click', () => removeZone(zone.id));
    head.appendChild(nameInput);
    head.appendChild(removeBtn);

    const hint = document.createElement('div');
    hint.className = 'dz-hint';
    hint.textContent = `拖拽或点击上传，最多 ${MAX_FILES} 张`;

    const drop = document.createElement('div');
    drop.className = 'dz-drop';
    drop.textContent = '拖拽图片到此处，或点击选择文件';

    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.multiple = true;

    const thumbs = document.createElement('div');
    thumbs.className = 'dz-thumbs';

    const progressRow = document.createElement('div');
    progressRow.className = 'dz-progress-row';
    const countSpan = document.createElement('span');
    const pctSpan = document.createElement('span');
    progressRow.appendChild(countSpan);
    progressRow.appendChild(pctSpan);

    const bar = document.createElement('div');
    bar.className = 'dz-bar';
    const barFill = document.createElement('span');
    bar.appendChild(barFill);

    box.appendChild(head);
    box.appendChild(hint);
    box.appendChild(drop);
    box.appendChild(thumbs);
    box.appendChild(progressRow);
    box.appendChild(bar);
    box.appendChild(input);
    grid.appendChild(box);

    drop.addEventListener('click', () => input.click());
    input.addEventListener('change', e => addFiles(zone.id, e.target.files));
    ['dragenter', 'dragover'].forEach(ev => box.addEventListener(ev, e => {
      e.preventDefault(); box.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach(ev => box.addEventListener(ev, e => {
      e.preventDefault(); box.classList.remove('dragover');
    }));
    box.addEventListener('drop', e => addFiles(zone.id, e.dataTransfer.files));

    updateZoneProgress(zone.id, { countSpan, pctSpan, barFill, thumbs });
  });

  if(state.zones.length < MAX_ZONES){
    const addTile = document.createElement('div');
    addTile.className = 'dz-add';
    addTile.innerHTML = '<span class="plus">+</span><span>添加卡片</span>';
    addTile.addEventListener('click', addZone);
    grid.appendChild(addTile);
  }

  renderMatchPreview();
}

// 每个卡片的动态区域缓存，避免重新输入名字时打断输入焦点
const zoneEls = new Map();
function updateZoneProgress(zoneId, els){ zoneEls.set(zoneId, els); renderZoneProgress(zoneId); }
function renderZoneProgress(zoneId){
  const els = zoneEls.get(zoneId);
  if(!els) return;
  const arr = state.pending[zoneId] || [];
  els.countSpan.textContent = `已上传 ${arr.length} / ${MAX_FILES}`;
  const pct = Math.round(arr.length / MAX_FILES * 100);
  els.pctSpan.textContent = pct + '%';
  els.barFill.style.width = pct + '%';
  els.thumbs.innerHTML = '';
  arr.slice(-12).forEach(f => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    els.thumbs.appendChild(img);
  });
}

function addZone(){
  if(state.zones.length >= MAX_ZONES) return;
  const id = 'z' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  state.zones.push({ id, name: `卡片 ${state.zones.length + 1}` });
  state.pending[id] = [];
  saveZones();
  renderUploadZones();
}
function removeZone(zoneId){
  if(state.zones.length <= 1) return;
  state.zones = state.zones.filter(z => z.id !== zoneId);
  delete state.pending[zoneId];
  zoneEls.delete(zoneId);
  saveZones();
  renderUploadZones();
}

function addFiles(zoneId, fileList){
  const arr = state.pending[zoneId];
  const seen = new Set(arr.map(f => f.name));
  for(const f of fileList){
    if(!f.type.startsWith('image/')) continue;
    if(seen.has(f.name)) continue;
    if(arr.length >= MAX_FILES) break;
    arr.push(f);
    seen.add(f.name);
  }
  renderZoneProgress(zoneId);
  renderMatchPreview();
}

function renderMatchPreview(){
  const note = document.getElementById('matchNote');
  const total = state.zones.reduce((s, z) => s + (state.pending[z.id] || []).length, 0);
  if(total === 0){
    note.innerHTML = '各卡片都上传后点击「开始配对」，系统会按文件名自动匹配为一组';
    return;
  }
  const keysByZone = {};
  state.zones.forEach(z => { keysByZone[z.id] = computeKeys(state.pending[z.id] || []); });
  const allKeys = new Set();
  state.zones.forEach(z => keysByZone[z.id].forEach(k => allKeys.add(k)));
  let full = 0, partial = 0;
  const zoneCount = state.zones.length;
  allKeys.forEach(k => {
    const hits = state.zones.filter(z => keysByZone[z.id].includes(k)).length;
    if(hits === zoneCount) full++; else partial++;
  });
  note.innerHTML = `按文件名配对预览：<b>${full}</b> 组齐全 · <b>${partial}</b> 组缺图`;
}

document.getElementById('btnPair').addEventListener('click', doPairing);

async function doPairing(){
  const total = state.zones.reduce((s, z) => s + (state.pending[z.id] || []).length, 0);
  if(total === 0){ alert('请先至少上传一张图片'); return; }
  showOverlay('正在压缩并配对图片…');

  const keysByZone = {};
  state.zones.forEach(z => { keysByZone[z.id] = computeKeys(state.pending[z.id] || []); });

  const itemMap = new Map(); // key -> {values:{zoneId:{...}}}
  for(const zone of state.zones){
    const files = state.pending[zone.id] || [];
    const keys = keysByZone[zone.id];
    for(let i = 0; i < files.length; i++){
      const key = keys[i];
      if(!itemMap.has(key)) itemMap.set(key, { key, values: {} });
      const { blob, width, height } = await compressImage(files[i]);
      itemMap.get(key).values[zone.id] = { name: files[i].name, blob, w: width, h: height };
    }
  }

  const items = Array.from(itemMap.values())
    .sort((a, b) => collator.compare(a.key, b.key))
    .map(it => ({ key: it.key, values: it.values, tag: null, note: '' }));

  await dbPutAll(items);
  hydrateItems(items);
  hideOverlay();

  document.getElementById('tabP2').disabled = false;
  document.getElementById('tabP3').disabled = false;
  switchTab('p2');
}

function hydrateItems(items){
  items.forEach(it => {
    Object.keys(it.values).forEach(zid => {
      const v = it.values[zid];
      if(v && v.blob && !v.url) v.url = URL.createObjectURL(v.blob);
    });
  });
  state.items = items;
  state.curIndex = 0;
  renderSideList();
  renderCurrent();
  renderStats();
}

/* ================== Tab 切换 ================== */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => { if(!btn.disabled) switchTab(btn.dataset.target); });
});
function switchTab(id){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.target === id));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  if(id === 'p3') renderResults();
}

/* ================== 页面 2：逐条评测 ================== */
function renderCurrent(){
  const it = state.items[state.curIndex];
  const triple = document.getElementById('curTriple');
  triple.innerHTML = '';
  if(!it){
    document.getElementById('curFname').textContent = '暂无数据';
    return;
  }
  document.getElementById('curFname').textContent = `${it.key} · 第 ${state.curIndex + 1} 组 / 共 ${state.items.length} 组`;
  state.zones.forEach(z => {
    const entry = it.values[z.id];
    const cell = document.createElement('div');
    if(entry){
      cell.className = 'cell';
      cell.innerHTML = `<img src="${entry.url}"><span class="cap">${escapeHtml(z.name)}</span>`;
    } else {
      cell.className = 'cell missing';
      cell.textContent = `缺 ${z.name}`;
    }
    triple.appendChild(cell);
  });
  document.querySelectorAll('.tagbar .tagbtn').forEach(b => b.classList.toggle('picked', b.dataset.tag === it.tag));
  document.getElementById('curNote').value = it.note || '';
  document.getElementById('navPrev').disabled = state.curIndex === 0;
  document.getElementById('navNext').disabled = state.curIndex === state.items.length - 1;
  renderSideList();
}

document.querySelectorAll('.tagbar .tagbtn').forEach(btn => {
  btn.addEventListener('click', () => setTag(state.items[state.curIndex], btn.dataset.tag, true));
});
function setTag(item, tag, advance){
  if(!item) return;
  item.tag = item.tag === tag ? null : tag;
  dbPut(sanitizeForDB(item));
  renderCurrent();
  renderStats();
  if(advance && item.tag && state.curIndex < state.items.length - 1){
    state.curIndex++;
    renderCurrent();
  }
}
function sanitizeForDB(item){
  // url 是运行时生成的 ObjectURL，不需要持久化
  const clone = { key: item.key, tag: item.tag, note: item.note, values: {} };
  Object.keys(item.values).forEach(zid => {
    const v = item.values[zid];
    clone.values[zid] = v ? { name: v.name, blob: v.blob, w: v.w, h: v.h } : null;
  });
  return clone;
}

let noteTimer = null;
document.getElementById('curNote').addEventListener('input', e => {
  const it = state.items[state.curIndex];
  if(!it) return;
  it.note = e.target.value;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => dbPut(sanitizeForDB(it)), 400);
});

document.getElementById('navPrev').addEventListener('click', () => { if(state.curIndex > 0){ state.curIndex--; renderCurrent(); } });
document.getElementById('navNext').addEventListener('click', () => { if(state.curIndex < state.items.length - 1){ state.curIndex++; renderCurrent(); } });
document.addEventListener('keydown', e => {
  if(!document.getElementById('p2').classList.contains('active')) return;
  if(document.activeElement.tagName === 'TEXTAREA') return;
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault(); // 防止浏览器默认的左右滚动/焦点跳动带着工作区一起晃动
  if(e.key === 'ArrowLeft') document.getElementById('navPrev').click();
  if(e.key === 'ArrowRight') document.getElementById('navNext').click();
});

function firstThumb(it){
  for(const z of state.zones){
    if(it.values[z.id]) return it.values[z.id];
  }
  return null;
}

function renderSideList(){
  const list = document.getElementById('sideList');
  document.getElementById('sideCount').textContent = `全部 ${state.items.length} 组`;
  list.innerHTML = '';
  state.items.forEach((it, idx) => {
    const row = document.createElement('div');
    row.className = 'side-item' + (idx === state.curIndex ? ' current' : '');
    const thumb = firstThumb(it);
    row.innerHTML = `<img class="sw" src="${thumb ? thumb.url : ''}"><span class="nm">${escapeHtml(it.key)}</span><span class="dot ${it.tag || 'none'}"></span>`;
    row.addEventListener('click', () => { state.curIndex = idx; renderCurrent(); });
    list.appendChild(row);
  });
}

function renderStats(){
  const total = state.items.length;
  const good = state.items.filter(i => i.tag === 'good').length;
  const bad = state.items.filter(i => i.tag === 'bad').length;
  const pending = state.items.filter(i => i.tag === 'pending').length;
  const marked = good + bad + pending;
  const pct = n => total ? Math.round(n / total * 100) + '%' : '0%';
  document.getElementById('statGoodPct').textContent = pct(good);
  document.getElementById('statBadPct').textContent = pct(bad);
  document.getElementById('statPendingPct').textContent = pct(pending);
  document.getElementById('statMarked').textContent = `${marked} / ${total}`;
}

document.getElementById('btnFinish').addEventListener('click', () => switchTab('p3'));
document.getElementById('btnFinish2').addEventListener('click', () => switchTab('p3'));

/* ================== 页面 3：结果汇总 ================== */
document.querySelectorAll('#filterPills .pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#filterPills .pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.filter = btn.dataset.f;
    renderResults();
  });
});

function filteredItems(){
  return state.items.filter(it => {
    if(state.filter === 'bad') return it.tag === 'bad';
    if(state.filter === 'good') return it.tag === 'good';
    if(state.filter === 'pending') return it.tag === 'pending';
    if(state.filter === 'marked') return !!it.tag;
    return true;
  });
}

function renderResults(){
  const grid = document.getElementById('resultGrid');
  const items = filteredItems();
  document.getElementById('filterCount').textContent = `共 ${items.length} 组`;
  grid.innerHTML = '';
  if(items.length === 0){
    grid.innerHTML = '<div class="empty-hint">没有符合条件的图片</div>';
    return;
  }
  items.forEach(it => {
    const card = document.createElement('div');
    card.className = 'rcard';
    const row = document.createElement('div');
    row.className = 'triplerow';
    row.style.gridTemplateColumns = `repeat(${Math.max(state.zones.length, 1)}, 1fr)`;
    state.zones.forEach(z => {
      const entry = it.values[z.id];
      const cell = document.createElement('div');
      cell.className = 'cell';
      if(entry) cell.innerHTML = `<img src="${entry.url}">`;
      row.appendChild(cell);
    });
    row.addEventListener('click', () => openLightbox(it));
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<span class="fname">${escapeHtml(it.key)}</span><button class="badge ${it.tag || 'none'}" data-key="${it.key}">${tagLabel(it.tag)}</button>`;
    meta.querySelector('button').addEventListener('click', ev => {
      ev.stopPropagation();
      cycleTag(it);
      renderResults();
    });
    card.appendChild(row);
    card.appendChild(meta);
    if(it.note){
      const noteEl = document.createElement('div');
      noteEl.className = 'note';
      noteEl.textContent = it.note;
      card.appendChild(noteEl);
    }
    grid.appendChild(card);
  });
}
function tagLabel(tag){
  return tag === 'good' ? 'Good' : tag === 'bad' ? 'Bad' : tag === 'pending' ? 'Medium' : '未标记';
}
function cycleTag(it){
  const order = [null, 'good', 'bad', 'pending'];
  const next = order[(order.indexOf(it.tag) + 1) % order.length];
  it.tag = next;
  dbPut(sanitizeForDB(it));
  renderStats();
}

let lightboxItem = null;
function openLightbox(it){
  lightboxItem = it;
  document.getElementById('lightboxName').textContent = it.key;

document.getElementById('btnCloseLb').addEventListener('click', () => document.getElementById('lightbox').classList.remove('open'));
document.getElementById('lightbox').addEventListener('click', e => { if(e.target.id === 'lightbox') e.currentTarget.classList.remove('open'); });
document.querySelectorAll('#lightbox .badge[data-tag]').forEach(btn => {
  btn.addEventListener('click', () => {
    if(!lightboxItem) return;
    lightboxItem.tag = lightboxItem.tag === btn.dataset.tag ? null : btn.dataset.tag;
    dbPut(sanitizeForDB(lightboxItem));
    openLightbox(lightboxItem);
    renderResults();
    renderStats();

});

async function composeCanvas(it, cellW = 480, cellH = 640){
  const zones = state.zones;
  const canvas = document.createElement('canvas');
  canvas.width = cellW * Math.max(zones.length, 1);
  canvas.height = cellH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f2f1ed';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for(let i = 0; i < zones.length; i++){
    const entry = it.values[zones[i].id];
    if(!entry) continue;
    const img = await loadImg(entry.url);
    const scale = Math.min(cellW / img.width, cellH / img.height);
    const w = img.width * scale, h = img.height * scale;
    const x = i * cellW + (cellW - w) / 2, y = (cellH - h) / 2;
    ctx.drawImage(img, x, y, w, h);
  }
  return canvas;
}
function loadImg(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

document.getElementById('btnDownload').addEventListener('click', async () => {
  if(!lightboxItem) return;
  const canvas = await composeCanvas(lightboxItem);
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${lightboxItem.key}_对比图.jpg`;
    a.click();
  }, 'image/jpeg', 0.92);
});

/* ================== 导出 HTML 报告 ================== */
document.getElementById('btnExportLocal').addEventListener('click', exportReportLocal);

async function buildExportHTML(){
  const items = filteredItems();
  if(items.length === 0) return null;
  showOverlay(`正在生成报告（${items.length} 组）…`);

  const zoneCount = Math.max(state.zones.length, 1);
  const rows = [];
  for(const it of items){
    const cells = await Promise.all(state.zones.map(async z => {
      const entry = it.values[z.id];
      if(!entry) return `<div class="cell missing">缺 ${escapeHtml(z.name)}</div>`;
      const dataUrl = await blobToDataURL(entry.blob);
      return `<div class="cell"><img src="${dataUrl}"></div>`;
    }));
    rows.push(`
      <div class="rcard" data-tag="${it.tag || ''}">
        <div class="triplerow" style="grid-template-columns:repeat(${zoneCount},1fr);">${cells.join('')}</div>
        <div class="meta"><span class="fname">${escapeHtml(it.key)}</span><span class="badge ${it.tag || 'none'}">${tagLabel(it.tag)}</span></div>
        ${it.note ? `<div class="note">${escapeHtml(it.note)}</div>` : ''}
      </div>`);
  }

  const total = state.items.length;
  const good = state.items.filter(i => i.tag === 'good').length;
  const bad = state.items.filter(i => i.tag === 'bad').length;
  const pending = state.items.filter(i => i.tag === 'pending').length;
  const pct = n => total ? Math.round(n / total * 100) + '%' : '0%';

  const title = (document.getElementById('reportTitleInput').value || '').trim() || '图片对比评测报告';

  const html = buildReportHTML({
    title,
    rows: rows.join('\n'),
    good: pct(good), bad: pct(bad), pending: pct(pending),
    count: items.length, total,
    filterName: { all: '全部', bad: '仅 Bad case', good: '仅 Good case', pending: '仅 Medium', marked: '只看已标记' }[state.filter],
  });
  hideOverlay();
  return html;
}

async function exportReportLocal(){
  const html = await buildExportHTML();
  if(html === null){ alert('当前筛选下没有可导出的数据'); return; }
  const title = (document.getElementById('reportTitleInput').value || '').trim() || '图片对比评测报告';
  const safeName = title.replace(/[\\/:*?"<>|]/g, '').trim() || '图片对比评测报告';
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${safeName}_${new Date().toISOString().slice(0,10)}.html`;
  a.click();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function buildReportHTML({ title, rows, good, bad, pending, count, total, filterName }){
  return `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<title>${escapeHtml(title)}</title>
<style>

</style></head>
<body><div class="wrap">
<h1>${escapeHtml(title)}</h1>
<div class="sub">导出范围：${filterName} · 共 ${count} 组（全量数据共 ${total} 组）</div>
<div class="stat-row">
  <div class="stat good">Good case 率<b>${good}</b></div>
  <div class="stat bad">Bad case 率<b>${bad}</b></div>
  <div class="stat pending">Medium 中等可通过率<b>${pending}</b></div>
</div>
<div class="grid">${rows}</div>
</div></body></html>`;
}

function showOverlay(text){
  document.getElementById('overlayText').textContent = text;
  document.getElementById('overlay').classList.add('show');
}
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }

renderUploadZones();

(async function init(){
  try{
    const items = await dbGetAll();
    if(items.length){
      items.sort((a, b) => collator.compare(a.key, b.key));
      hydrateItems(items);
      document.getElementById('tabP2').disabled = false;
      document.getElementById('tabP3').disabled = false;
    }
  }catch(err){
    console.warn('读取历史数据失败', err);
  }
})();
</script>
